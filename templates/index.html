<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ college_name }} - AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 750px;
            height: 90vh;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #182848;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.85;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
        }

        .user .bubble {
            background: #182848;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: #e9edf2;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        button {
            border: none;
            background: #182848;
            color: white;
            padding: 0 22px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .typing {
            color: #777;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>🎓 {{ college_name }}</h1>
        <p>Intelligent College Assistant</p>
    </div>

    <div id="chat">

        <div class="message bot">
            <div class="bubble">
                Hello! 👋 I'm your College AI Assistant.
                <br><br>
                How can I help you today?
            </div>
        </div>

    </div>

    <div class="input-area">
        <input
            type="text"
            id="message"
            placeholder="Ask something about the college..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

function addMessage(text, sender) {

    const message = document.createElement("div");
    message.className = "message " + sender;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = text.replace(/\n/g, "<br>");

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    const typing = document.createElement("div");
    typing.className = "message bot";
    typing.id = "typing";

    typing.innerHTML =
        '<div class="bubble typing">Thinking...</div>';

    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch("/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        const typingElement = document.getElementById("typing");

        if (typingElement) {
            typingElement.remove();
        }

        if (data.reply) {
            addMessage(data.reply, "bot");
        } else if (data.error) {
            addMessage("Sorry, something went wrong: " + data.error, "bot");
        } else {
            addMessage("Sorry, I couldn't understand that.", "bot");
        }

    } catch (error) {

        const typingElement = document.getElementById("typing");

        if (typingElement) {
            typingElement.remove();
        }

        addMessage(
            "Unable to connect to the chatbot server.",
            "bot"
        );
    }
}

</script>

</body>
</html>
